services:
  db-transactions:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  ms-transactions:
    build: ./ms-transactions
    ports:
      - "3001:3001"
    env_file: ./ms-transactions/.env
    depends_on:
      db-transactions:
        condition: service_healthy
    networks:
      - wallet-network

  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  ms-users:
    build: ./ms-users
    ports:
      - "3002:3002"
    env_file: ./ms-users/.env
    depends_on:
      db-users:
        condition: service_healthy
      ms-transactions:
        condition: service_started
    networks:
      - wallet-network

networks:
  wallet-network:
    driver: bridge
